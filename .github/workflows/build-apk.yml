name: Build Vyasa Mahabharata Android App

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Allows one-click manual trigger from GitHub UI / mobile app

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vyas-Mahabharata-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error

      - name: Generate Build Summary
        run: |
          echo "### 🕉️ Vyasa Mahabharata App Built Successfully! 🕉️" >> $GITHUB_STEP_SUMMARY
          echo "The compiled debug APK is ready for installation on your Android phone." >> $GITHUB_STEP_SUMMARY
          echo "Download it from the **Artifacts** section at the top of this run summary." >> $GITHUB_STEP_SUMMARY
