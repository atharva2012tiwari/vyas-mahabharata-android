# AndroidX & Jetpack Compose
android.useAndroidX=true
android.nonTransitiveRClass=true

# Low-Memory JVM optimization for 4GB RAM machines
# Prevents Gradle from consuming all system RAM while keeping builds smooth
org.gradle.jvmargs=-Xmx1200m -XX:MaxMetaspaceSize=384m -XX:+UseParallelGC
org.gradle.parallel=false
org.gradle.daemon=false
org.gradle.configuration-cache=true
kotlin.incremental=true
kotlin.daemon.jvmargs=-Xmx600m
